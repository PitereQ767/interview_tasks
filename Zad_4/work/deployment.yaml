apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: interview
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-web
  template:
    metadata:
      labels:
        app: interview-web
    spec:
      containers:
        - name: web
          image: localhost/docker-k8s-interview-app:1.0
          imagePullPolicy: Never
          command: ["python", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_MESSAGE
              value: Hello from Kubernetes
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
